name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Move inline app bundle to an external module
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          open_tag = '<script type="module" crossorigin>'
          external_tag = '<script type="module" crossorigin src="app.bundle.js?v=20261020-6"></script>'

          if external_tag not in html:
              start = html.find(open_tag)
              if start < 0:
                  raise SystemExit('inline module script not found')
              code_start = start + len(open_tag)
              code_end = html.find('</script>', code_start)
              head_end = html.find('</head>', code_end + len('</script>'))
              if code_end < code_start:
                  raise SystemExit('module closing tag not found')
              if head_end < 0:
                  raise SystemExit('real </head> must follow module closing tag')
              bundle = html[code_start:code_end]
              if not bundle.strip():
                  raise SystemExit('inline module bundle is empty')
              Path('app.bundle.js').write_text(bundle, encoding='utf-8')
              html = html[:start] + external_tag + html[code_end + len('</script>'):]
              p.write_text(html, encoding='utf-8')

          published = p.read_text(encoding='utf-8')
          if external_tag not in published or not Path('app.bundle.js').exists():
              raise SystemExit('external bundle conversion failed')
          if published.count('<script type="module" crossorigin>'):
              raise SystemExit('inline module remained after conversion')
          if '<div id="root"></div>' not in published:
              raise SystemExit('application root missing after conversion')
          print('PASS: app bundle externalized for GitHub Pages')
          PY
      - name: Add v2-compatible enhancements to published page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          import re
          # Strip any version of the enhancement script, then insert exactly once.
          html = re.sub(
              r'<script\\s+src="(?:\\./)?attendance-enhancements\\.js(?:\\?[^"]*)?"\\s*(?:defer)?\\s*></script>',
              '',
              html,
          )
          body_end = html.rfind('</body>')
          if body_end < 0:
              raise SystemExit('index.html has no </body>')
          html = html[:body_end] + '<script src="./attendance-enhancements.js?v=20261020-5" defer></script>' + html[body_end:]
          p.write_text(html, encoding='utf-8')
          assert html.count('attendance-enhancements.js') == 1, 'duplicate enhancement script'
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
